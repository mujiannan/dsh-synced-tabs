name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Offline test suite
        run: npm test

      - name: Syntax check
        run: |
          node --check client.js
          node --check index.js
          node --check lib/host.js

      - name: No private references
        run: bash scripts/check-public.sh
